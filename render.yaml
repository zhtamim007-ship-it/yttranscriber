services:
  - type: web
    name: sonicscript-ai
    runtime: docker

    # Keep the service on Render's no-cost tier.
    plan: free

    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      # Process only one video at a time because the Free instance
      # has limited CPU and memory.
      - key: MAX_CONCURRENT_JOBS
        value: "1"

      - key: JOB_TTL_SECONDS
        value: "14400"

      - key: ENABLE_DENOISE
        value: "true"

      - key: PYTHON_VERSION
        value: "3.12"
